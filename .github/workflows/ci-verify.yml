name: Dee-Bot-Agents CI & Smoke Verification

on:
  push:
    branches: [ main, control-ops ]
  pull_request:
    branches: [ main ]

jobs:
  verify-core-and-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless display and capture tools
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils ffmpeg

      - name: Start local DEE gateways for smoke verification
        run: |
          nohup python3 node_agent/gateway.py > /tmp/dee_gateway.log 2>&1 &
          nohup python3 node_agent/bench.py > /tmp/dee_bench.log 2>&1 &
          for port in 8730 8731; do
            ready=0
            for _ in $(seq 1 50); do
              if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.2); sys.exit(0 if s.connect_ex(('127.0.0.1',$port))==0 else 1)"; then
                ready=1
                break
              fi
              sleep 0.2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Gateway $port failed to start"; cat /tmp/dee_gateway.log /tmp/dee_bench.log; exit 1
            fi
          done

      - name: Run DEE Platform Test Suite (Unit, Integration, Security, E2E, Stress, Benchmarks)
        run: xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Run Dee-Bot-Agents End-to-End Smoke Suite
        run: xvfb-run -a python3 scripts/smoke_test.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build 3D Spatial HUD (Three.js + React)
        working-directory: ./frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
