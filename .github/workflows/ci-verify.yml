name: Dee-Bot-Agents CI & Smoke Verification

on:
  push:
    branches: [ main, control-ops ]
  pull_request:
    branches: [ main ]

jobs:
  verify-core-and-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Dee-Bot-Agents End-to-End Smoke Suite
        run: python3 scripts/smoke_test.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build 3D Spatial HUD (Three.js + React)
        working-directory: ./frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
